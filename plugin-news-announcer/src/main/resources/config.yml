# ============================================================
# plugins/PluginNewsAnnouncer/config.yml
# À installer sur CHAQUE serveur Paper que tu veux suivre (survie, skyblock,
# mini-jeux, lobby...). Copie ce fichier tel quel, puis change juste
# "server-name" pour qu'il corresponde à CE serveur précis avant de le
# déposer dans son dossier plugins/.
# ============================================================

# Nom affiché dans les annonces (Discord, site web, livre au lobby).
# Change cette ligne à chaque nouveau serveur : "Survie", "Skyblock",
# "HikaBrain", "BedWars", "Lobby"...
server-name: "Survie"

discord:
  enabled: true
  webhook-url: "https://discord.com/api/webhooks/METS_TON_WEBHOOK_ICI"

lobby:
  enabled: true
  # Nom EXACT du serveur "lobby" tel que déclaré dans la section [servers]
  # de velocity.toml. D'après tes logs Velocity actuels, c'est bien "lobby".
  target-server: "lobby"

website:
  enabled: true
  api-url: "https://herocraft.servegame.com/api/plugin-news"
  # Doit être EXACTEMENT la même valeur que PLUGIN_NEWS_API_KEY dans le
  # .env du site (voir mc-site-avec-news-announcer.zip).
  api-key: "f91ec210619aebfe8a609c2240b1744eb947b5b6ad0fef56c843450989bcd749"

github:
  username: "herocraftlol"
  token: ""   # recommandé : Personal Access Token GitHub (scope "public_repo"), passe de 60 à 5000 req/h
  default-tag-prefix: "v"
  # Le changelog annoncé agrège TOUTES les releases GitHub publiées depuis l'ancienne
  # version installée, bornées à cette fenêtre (en jours). Ex: si le serveur redémarre
  # après 3 releases sorties en 4 jours, les 3 changelogs sont concaténés en un seul.
  changelog-window-days: 7
  # Vérifie AUSSI, pour les plugins déjà installés dont la version locale n'a PAS changé
  # entre deux scans (donc invisibles pour la détection habituelle), si la release GitHub
  # correspondant à leur version actuelle a été publiée récemment. Utile si un plugin est
  # déployé une seule fois avec une version qui, elle, vient de sortir sur GitHub : sans ça,
  # cette nouveauté ne serait jamais détectée. Chaque version n'est signalée qu'une seule fois.
  recent-release-check:
    enabled: true
    window-days: 7

scan-interval-minutes: 15

# Overrides manuels (uniquement si un plugin ne correspond à aucun repo par
# ressemblance de nom, ou vient de Spigot / est un jar maison) :
plugins: {}
