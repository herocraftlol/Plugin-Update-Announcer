# ============================================
# Plugin News Announcer - Configuration
# ============================================

# Nom affiché de ce serveur dans les annonces (ex: "Survie", "Skyblock", "Lobby")
server-name: "Survie"

# ---- Destinations ----
discord:
  enabled: true
  webhook-url: "https://discord.com/api/webhooks/XXXX/YYYY"

lobby:
  enabled: true
  # Nom du serveur BungeeCord "lobby" (doit correspondre au config.yml de Bungee).
  # Le plugin PluginNewsLobby installé SUR ce serveur reçoit les données et gère
  # le livre + le ping de chat + le suivi par joueur. Rien d'autre à configurer ici.
  target-server: "lobby"

website:
  enabled: true
  api-url: "https://tonsite.com/api/plugin-news"
  # Si ton API nécessite une clé (recommandé)
  api-key: "change-moi"

# ---- GitHub ----
# Renseigne juste ton pseudo/organisation : le plugin liste TOUS les repos publics de
# https://github.com/herocraftlol et les associe automatiquement aux plugins installés
# en comparant les noms. Plus besoin de rien ajouter manuellement quand tu crées un
# nouveau repo dans l'organisation.
github:
  username: "herocraftlol"
  token: ""   # recommandé : Personal Access Token (scope "public_repo"), passe de 60 à 5000 req/h
  # Format des tags utilisé par la majorité de tes repos ("v1.2.3" -> "v", "1.2.3" -> "")
  # Sert de valeur par défaut ; le fetcher retente aussi en fuzzy-match si ça ne correspond pas.
  default-tag-prefix: "v"

# ---- Vérification en temps réel ----
# En plus du scan fait au démarrage du serveur, le plugin relance périodiquement le
# même cycle de détection (scan des jars + vérification des dernières releases GitHub)
# sans nécessiter de redémarrage. Utile si tu déploies un nouveau .jar à chaud, ou si
# une release est publiée sur https://github.com/herocraftlol pendant que le serveur tourne.
# Mets 0 pour désactiver et ne scanner qu'au démarrage.
scan-interval-minutes: 15

# ---- Overrides manuels (optionnel) ----
# Utile seulement si :
#  - le nom du repo GitHub ne ressemble pas du tout au nom du plugin (matching auto impossible)
#  - le plugin vient de Spigot plutôt que GitHub
#  - le plugin est un jar maison avec un CHANGELOG.md local
# Si un plugin n'apparaît pas ici, la détection automatique par nom est utilisée.
plugins:
  EconomyPlus:
    source: spigot
    resource-id: 12345

  MonPluginMaison:
    source: manual
    changelog-file: "plugins/MonPluginMaison/CHANGELOG.md"

  # Exemple d'override si le repo ne matche pas le nom du plugin :
  # NomDuPlugin:
  #   source: github
  #   repo: "TonPseudoGithub/nom-de-repo-different"
  #   tag-prefix: ""

