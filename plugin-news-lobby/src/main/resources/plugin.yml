name: PluginNewsLobby
version: '${project.version}'
main: com.example.newslobby.NewsLobbyMain
api-version: '1.21'
author: HeroCraft
description: Affiche les nouveautés agrégées de tous les mondes au lobby (livre + ping de chat)

commands:
  nouveautes:
    description: Réafficher les nouveautés récentes, gérer l'affichage auto, ou consulter le journal par date
    usage: "/<command> [auto on|off] [date jj/mm/aaaa]"
    aliases: [news, pluginnews]
